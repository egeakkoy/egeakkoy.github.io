<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Match Tracker</title>
  <style>
    :root {
      --bg: #000000;
      --card: #111318;
      --card-border: #222630;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f59e0b;
      --fb-blue: #1d4ed8;
      --fb-yellow: #facc15;
      --ucl: #38bdf8;
      --bjk: #e5e7eb;
      --tur: #ef4444;
      --green: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 80px 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    select, .btn {
      background: #181b22;
      color: var(--text);
      border: 1px solid #2e3440;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-accent {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    .search-bar {
      width: 100%;
      background: #14171f;
      border: 1px solid #262b36;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      outline: none;
    }
    .search-bar:focus { border-color: var(--accent); }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #14171f;
      color: var(--muted);
      border: 1px solid #232834;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    .sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 4px 16px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .toggle-past {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 16px;
    }
    .date-header {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 18px 0 8px 2px;
    }
    .match-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .match-card.cat-fb-foot { border-left-color: var(--fb-yellow); }
    .match-card.cat-fb-basket { border-left-color: #3b82f6; }
    .match-card.cat-ucl { border-left-color: var(--ucl); }
    .match-card.cat-bjk { border-left-color: var(--bjk); }
    .match-card.cat-tur { border-left-color: var(--tur); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1c202b;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      color: #d1d5db;
    }
    .countdown {
      font-weight: 700;
      color: var(--green);
      font-size: 0.75rem;
    }
    .countdown.live {
      color: #ef4444;
      animation: pulse 1.4s infinite;
    }
    .countdown.past { color: var(--muted); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .teams-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .teams-names {
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .score-box {
      background: #1d222e;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--fb-yellow);
      white-space: nowrap;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid #1b1f2a;
      padding-top: 8px;
    }
    .datetime-text {
      color: #e5e7eb;
      font-weight: 600;
    }
    .card-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: #1b1f2a;
      border: 1px solid #2a3040;
      color: #d1d5db;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.73rem;
      cursor: pointer;
    }
    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #14171f;
      border: 1px solid #2e3440;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 18px;
    }
    .modal h3 { margin: 0 0 12px 0; font-size: 1.05rem; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px 10px;
      background: #0d0f14;
      border: 1px solid #2a3040;
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="app-title">🏆 Match Tracker</div>
      <div class="controls-row">
        <select id="tz-select" title="Timezone">
          <option value="local">📍 Phone Time</option>
          <option value="Europe/Istanbul">🇹🇷 TRT (UTC+3)</option>
          <option value="Europe/Berlin">🇪🇺 CET/CEST</option>
          <option value="UTC">🌐 UTC</option>
        </select>
        <button class="btn" id="sync-btn" onclick="syncLiveScores()">🔄 Live</button>
        <button class="btn btn-accent" onclick="openModal()">+ Add</button>
      </div>
    </div>

    <input type="text" id="search-input" class="search-bar" placeholder="Search team, competition, or city (e.g. Liverpool, Real Madrid, Derby)..." oninput="renderMatches()" />

    <div class="tabs" id="tabs-bar">
      <button class="tab active" data-cat="all" onclick="setCategory('all')">All Matches</button>
      <button class="tab" data-cat="fb-foot" onclick="setCategory('fb-foot')">💛💙 FB Football</button>
      <button class="tab" data-cat="fb-basket" onclick="setCategory('fb-basket')">🏀 FB Beko</button>
      <button class="tab" data-cat="ucl" onclick="setCategory('ucl')">⭐ Champions League</button>
      <button class="tab" data-cat="bjk" onclick="setCategory('bjk')">🦅 Beşiktaş (Europe)</button>
      <button class="tab" data-cat="tur" onclick="setCategory('tur')">🇹🇷 Türkiye National</button>
      <button class="tab" data-cat="custom" onclick="setCategory('custom')">📌 Custom</button>
    </div>
  </header>

  <div class="container">
    <div class="sub-bar">
      <span id="match-count">Showing upcoming matches</span>
      <button class="toggle-past" id="toggle-past-btn" onclick="togglePast()">Show Recent Results</button>
    </div>
    <div id="matches-list"></div>
  </div>

  <!-- Add Custom Match Modal -->
  <div class="modal-backdrop" id="add-modal">
    <div class="modal">
      <h3>➕ Add Custom Match</h3>
      <div class="form-group">
        <label>Home vs Away Teams</label>
        <input type="text" id="custom-teams" placeholder="e.g. Arsenal vs Chelsea" />
      </div>
      <div class="form-group">
        <label>Competition / League</label>
        <input type="text" id="custom-league" placeholder="e.g. Premier League" />
      </div>
      <div class="form-group">
        <label>Date & Kick-off Time (Your Local Time)</label>
        <input type="datetime-local" id="custom-time" />
      </div>
      <div class="form-group">
        <label>Venue / Stadium (Optional)</label>
        <input type="text" id="custom-venue" placeholder="e.g. Emirates Stadium, London" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-accent" onclick="saveCustomMatch()">Save Match</button>
      </div>
    </div>
  </div>

    let activeCat = "all";
    let showPast = false;

    function getCustomMatches() {
      try {
        return JSON.parse(localStorage.getItem("custom_matches_v1") || "[]");
      } catch (e) { return []; }
    }

    function getAllMatches() {
      return [...BASE_MATCHES, ...getCustomMatches()].sort((a, b) => new Date(a.iso) - new Date(b.iso));
    }

    function setCategory(cat) {
      activeCat = cat;
      document.querySelectorAll(".tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.cat === cat);
      });
      renderMatches();
    }

    function togglePast() {
      showPast = !showPast;
      document.getElementById("toggle-past-btn").textContent = showPast ? "Hide Past Results" : "Show Recent Results";
      renderMatches();
    }

    function formatDateTime(isoStr, tz) {
      const date = new Date(isoStr);
      const optsDate = { weekday: "short", month: "short", day: "numeric", year: "numeric" };
      const optsTime = { hour: "2-digit", minute: "2-digit", hour12: false };
      if (tz !== "local") {
        optsDate.timeZone = tz;
        optsTime.timeZone = tz;
      }
      const datePart = new Intl.DateTimeFormat("en-GB", optsDate).format(date);
      const timePart = new Intl.DateTimeFormat("en-GB", optsTime).format(date);
      return { datePart, timePart };
    }

    function getCountdownText(isoStr, score) {
      const now = new Date();
      const start = new Date(isoStr);
      const diffMs = start - now;
      const diffMins = Math.floor(diffMs / 60000);

      if (diffMs < -125 * 60000) {
        return { text: score ? `Final (${score})` : "Finished", cls: "past" };
      }
      if (diffMs <= 0 && diffMs >= -125 * 60000) {
        const elapsed = Math.abs(diffMins);
        return { text: `🔴 LIVE (${elapsed}')`, cls: "live" };
      }
      const days = Math.floor(diffMins / 1440);
      const hours = Math.floor((diffMins % 1440) / 60);
      const mins = diffMins % 60;
      if (days > 0) return { text: `In ${days}d ${hours}h`, cls: "" };
      if (hours > 0) return { text: `In ${hours}h ${mins}m`, cls: "" };
      return { text: `Starts in ${mins}m!`, cls: "live" };
    }

    function renderMatches() {
      const tz = document.getElementById("tz-select").value;
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      const now = new Date();
      const listEl = document.getElementById("matches-list");

      const filtered = getAllMatches().filter(m => {
        const isPast = (new Date(m.iso) - now) < -125 * 60000;
        if (!showPast && isPast) return false;
        if (activeCat !== "all" && !m.cats.includes(activeCat)) return false;
        if (query) {
          const hay = `${m.home} ${m.away} ${m.league} ${m.venue || ""}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      document.getElementById("match-count").textContent = `${filtered.length} match${filtered.length === 1 ? "" : "es"} shown`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No matches found for this filter.</div>`;
        return;
      }

      let html = "";
      let lastDateHeader = "";

      filtered.forEach(m => {
        const { datePart, timePart } = formatDateTime(m.iso, tz);
        if (datePart !== lastDateHeader) {
          lastDateHeader = datePart;
          html += `<div class="date-header">📅 ${datePart}</div>`;
        }
        const cd = getCountdownText(m.iso, m.score);
        const primaryCat = m.cats[0] || "custom";
        const isCustom = m.cats.includes("custom");

        html += `
          <div class="match-card cat-${primaryCat}">
            <div class="card-top">
              <span class="badge">${m.sport || "⚽"} ${m.league}</span>
              <span class="countdown ${cd.cls}">${cd.text}</span>
            </div>
            <div class="teams-row">
              <div class="teams-names">${m.home} <span style="color:#6b7280;font-weight:400;">vs</span> ${m.away}</div>
              ${m.score ? `<div class="score-box">${m.score}</div>` : ""}
            </div>
            <div class="card-bottom">
              <div>
                <span class="datetime-text">🕒 ${timePart}</span>
                <span style="margin-left:8px;">🏟️ ${m.venue || "TBA"}</span>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="downloadICS('${m.home.replace(/'/g, "")} vs ${m.away.replace(/'/g, "")}', '${m.league.replace(/'/g, "")}', '${m.iso}', '${(m.venue || "").replace(/'/g, "")}')">📅 Cal</button>
                ${isCustom ? `<button class="icon-btn" onclick="deleteCustom('${m.id}')">🗑️</button>` : ""}
              </div>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;
    }

    function downloadICS(title, league, iso, venue) {
      const start = new Date(iso);
      const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "BEGIN:VEVENT",
        `DTSTART:${fmt(start)}`,
        `DTEND:${fmt(end)}`,
        `SUMMARY:${title} (${league})`,
        `LOCATION:${venue}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${title.replace(/\s+/g, "_")}.ics`;
      link.click();
    }

    function openModal() { document.getElementById("add-modal").classList.add("open"); }
    function closeModal() { document.getElementById("add-modal").classList.remove("open"); }

    function saveCustomMatch() {
      const teams = document.getElementById("custom-teams").value.trim();
      const league = document.getElementById("custom-league").value.trim() || "Custom Match";
      const timeVal = document.getElementById("custom-time").value;
      const venue = document.getElementById("custom-venue").value.trim() || "Custom Venue";

      if (!teams || !timeVal) {
        alert("Please enter both teams and the date/time.");
        return;
      }
      const parts = teams.split(/\s+vs\.?\s+|\s+-\s+/i);
      const home = parts[0] || teams;
      const away = parts[1] || "Opponent";

      const customList = getCustomMatches();
      customList.push({
        id: "cust_" + Date.now(),
        cats: ["custom"],
        sport: "⭐",
        league,
        home,
        away,
        iso: new Date(timeVal).toISOString(),
        venue
      });
      localStorage.setItem("custom_matches_v1", JSON.stringify(customList));
      closeModal();
      renderMatches();
    }

    function deleteCustom(id) {
      const updated = getCustomMatches().filter(m => m.id !== id);
      localStorage.setItem("custom_matches_v1", JSON.stringify(updated));
      renderMatches();
    }

    async function syncLiveScores() {
      const btn = document.getElementById("sync-btn");
      btn.textContent = "⏳...";
      try {
        const urls = [
          "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
          "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard",
          "https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard"
        ];
        for (const url of urls) {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          (data.events || []).forEach(ev => {
            const comp = ev.competitions && ev.competitions[0];
            if (!comp) return;
            const competitors = comp.competitors || [];
            const h = competitors.find(c => c.homeAway === "home");
            const a = competitors.find(c => c.homeAway === "away");
            if (!h || !a) return;
            const hName = h.team.displayName.toLowerCase();
            const aName = a.team.displayName.toLowerCase();
            BASE_MATCHES.forEach(m => {
              if (hName.includes(m.home.toLowerCase().split(" ")[0]) || aName.includes(m.away.toLowerCase().split(" ")[0])) {
                if (comp.status && comp.status.type && comp.status.type.state !== "pre") {
                  m.score = `${h.score} - ${a.score}`;
                }
              }
            });
          });
        }
        btn.textContent = "✅ Synced";
        setTimeout(() => { btn.textContent = "🔄 Live"; }, 2500);
        renderMatches();
      } catch (e) {
        btn.textContent = "🔄 Live";
      }
    }

    document.getElementById("tz-select").addEventListener("change", renderMatches);
    renderMatches();
    setInterval(renderMatches, 30000);
  </script>
